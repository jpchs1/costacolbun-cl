name: Private Clasesdeski manual review
on:
  push:
    branches: [ops/clasesdeski-mail-audit-20261103]
    paths: [.github/workflows/clasesdeski-mail-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Authorized encrypted inbox export to owner device for individual review
        env:
          CPANEL_URL: ${{ secrets.CPANEL_URL }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
        shell: python
        run: |
          import base64
          import http.cookiejar
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import uuid
          
          required = ("CPANEL_URL", "CPANEL_USERNAME", "CPANEL_PASSWORD")
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit("Faltan secretos: " + ", ".join(missing))
          origin = os.environ["CPANEL_URL"].strip().rstrip("/")
          parsed = urllib.parse.urlsplit(origin)
          if parsed.scheme != "https" or parsed.username or parsed.password or parsed.path or parsed.query or parsed.fragment:
              raise SystemExit("CPANEL_URL debe ser una URL HTTPS del servidor, sin ruta.")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          client = urllib.request.build_opener(NoRedirect(), urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          session_token = ''
          credentials = os.environ["CPANEL_USERNAME"] + ":" + os.environ["CPANEL_PASSWORD"]
          authorization = "Basic " + base64.b64encode(credentials.encode()).decode()
          
          def api(module, function, params=None, body=None, content_type=None):
              global session_token
              url = origin + session_token + "/execute/" + module + "/" + function
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              headers = {"Authorization": authorization, "Accept": "application/json"}
              if content_type:
                  headers["Content-Type"] = content_type
              request = urllib.request.Request(url, data=body, headers=headers)
              try:
                  with client.open(request, timeout=90) as response:
                      result = json.loads(response.read().decode('utf-8', errors='replace'))
              except urllib.error.HTTPError as error:
                  if error.code == 401 and not session_token:
                      print("La autenticacion HTTP directa fue rechazada. Comprobando inicio de sesion de cPanel.")
                      payload = urllib.parse.urlencode({"user": os.environ["CPANEL_USERNAME"], "pass": os.environ["CPANEL_PASSWORD"], "goto_uri": "/"}).encode()
                      login_request = urllib.request.Request(origin + "/login/?login_only=1", data=payload, headers={"Content-Type": "application/x-www-form-urlencoded", "Accept": "application/json"})
                      try:
                          with client.open(login_request, timeout=60) as login_response:
                              login = json.load(login_response)
                      except urllib.error.HTTPError as login_error:
                          raw = login_error.read().decode("utf-8", errors="replace").lower()
                          if "two" in raw and "factor" in raw:
                              reason = "El servidor solicita segundo factor."
                          elif "brute" in raw or "cphulk" in raw or "blocked" in raw:
                              reason = "El servidor indica bloqueo de acceso."
                          else:
                              reason = "El inicio de sesion de cPanel tambien fue rechazado (HTTP " + str(login_error.code) + ")."
                          raise SystemExit(reason) from None
                      except (OSError, ValueError):
                          raise SystemExit("No se pudo completar el inicio de sesion de cPanel.") from None
                      token = login.get("security_token", "")
                      if login.get("status") != 1 or not re.fullmatch(r"/cpsess[0-9]+", token):
                          reason = "cPanel no concedio una sesion."
                          if login.get("tfa_required") or login.get("two_factor_authentication_required"):
                              reason = "cPanel solicita segundo factor."
                          raise SystemExit(reason)
                      session_token = token
                      print("Inicio de sesion de cPanel confirmado.")
                      return api(module, function, params, body, content_type)
                  raise SystemExit("cPanel devolvio HTTP " + str(error.code) + " en " + module + "/" + function) from None
              except (OSError, ValueError) as exc:
                  print("API_RESPONSE_ERROR_TYPE=" + type(exc).__name__)
                  raise SystemExit("No se pudo conectar o interpretar la respuesta de cPanel en " + module + "/" + function) from None
              if result.get("status") != 1:
                  # Avoid printing server responses that may include sensitive request details.
                  raise SystemExit("cPanel rechazo " + module + "/" + function + ". No se publicaron los siguientes archivos.")
              return result.get("data")
          
          
          
          
          import email.parser,gzip,zlib
          target="info@clasesdeski.cl"
          accounts=api("Email","list_pops",{"regex":"^info@clasesdeski[.]cl$"})
          if not any(a.get("email")==target for a in accounts):
              raise SystemExit("Mailbox not confirmed")
          root="/home/"+os.environ["CPANEL_USERNAME"]+"/mail/clasesdeski.cl/info"
          def listing(folder):
              result=api("Fileman","list_files",{"dir":folder,"include_mime":0,"show_hidden":1})
              return result.get("files",[]) if isinstance(result,dict) else result
          def names(folder):
              return {e.get("file") or e.get("name"):e for e in listing(folder) if (e.get("file") or e.get("name")) not in (None,".","..")}
          def content(folder,name):
              result=api("Fileman","get_file_content",{"dir":folder,"file":name,"from_charset":"iso-8859-1","to_charset":"utf-8"})
              if isinstance(result,list): result=result[0]
              return result.get("content","")
          def message(raw):
              buf=raw.encode("latin1",errors="replace")
              if buf.startswith(bytes([31,139])): raw=gzip.decompress(buf).decode("utf-8",errors="replace")
              elif buf.startswith(b"ZL"): raw=zlib.decompress(buf[3:],-15).decode("utf-8",errors="replace")
              return email.parser.HeaderParser().parsestr(raw.lstrip().lstrip(chr(65279)).lstrip())
          def move(source,dest):
              # Encode individual paths before constructing the API2 comma-list argument.
              params={"cpanel_jsonapi_user":os.environ["CPANEL_USERNAME"],"cpanel_jsonapi_apiversion":"2","cpanel_jsonapi_module":"Fileman","cpanel_jsonapi_func":"fileop","op":"move","sourcefiles":urllib.parse.quote(source,safe=""),"destfiles":urllib.parse.quote(dest,safe=""),"doubledecode":"1"}
              url=origin+session_token+"/json-api/cpanel?"+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={"Authorization":authorization,"Accept":"application/json"})
              with client.open(req,timeout=90) as response:
                  data=json.load(response).get("cpanelresult",{})
              rows=data.get("data") or []
              if data.get("event",{}).get("result")!=1 or not rows or any(str(row.get("result"))!="1" for row in rows):
                  raise SystemExit("Move not confirmed; stopping to preserve mailbox state")
          
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          import email.policy,html
          pub=serialization.load_pem_public_key("-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAyoA+KDY5vaSgzpViTfyK\ngqthApezALnqclMUr3FJL8kEkgmaBU2D1ryZrKIzDCsH88JfgZ8Ogz0t3GMeE14C\nKAWKxaftD1lu9l9oEm4C2RvrwI67LSafU6bxfLQj57XQYuuwkBLi7nP8rfa4uIKd\nVhLjy4EWQIopPLKPTk/17fTBryQUV1ujfjjLRHU/baxCvbooZUHNOoYmfgBK9qr+\ny5Se0XlYCsp6Ne6G9yLMZeRyW1IiLzqKdfniIAN0Tz142brWi46kRkpzfN+gJor0\n5+Ztk218aY0kYbConkSjsylUFxi3PESE9UBitgv+awze3jS/2BYCb+Nti+05BeG7\nIQIDAQAB\n-----END PUBLIC KEY-----\n".encode())
          records=[]
          errors=0
          count=0
          for sub in ("new","cur"):
              folder=root+"/"+sub
              entries=names(folder)
              print("INBOX_FOLDER_COUNT_"+sub.upper()+"="+str(len(entries)),flush=True)
              if len(entries)>2000: raise SystemExit("Inbox exceeds review bound; no changes")
              for name,entry in entries.items():
                  if "/" in name or name.startswith(".") or entry.get("type")=="dir": continue
                  uid=hashlib.sha256((sub+"/"+name).encode()).hexdigest()
                  try:
                      raw=content(folder,name)
                      buf=raw.encode("latin1",errors="replace")
                      if buf.startswith(bytes([31,139])): buf=gzip.decompress(buf)
                      elif buf.startswith(b"ZL"): buf=zlib.decompress(buf[3:],-15)
                      msg=email.message_from_bytes(buf,policy=email.policy.default)
                      def header(k): return str(msg.get(k,""))
                      texts=[]
                      htmltexts=[]
                      for part in msg.walk():
                          if part.get_content_disposition()=="attachment": continue
                          ct=part.get_content_type()
                          if ct in ("text/plain","text/html"):
                              try: val=part.get_content()
                              except (LookupError,ValueError): val=(part.get_payload(decode=True) or b"").decode("utf-8",errors="replace")
                              if ct=="text/plain": texts.append(str(val))
                              else: htmltexts.append(re.sub("<[^>]+>"," ",str(val)))
                      body=html.unescape("\n".join(texts if texts else htmltexts))
                      body=re.sub(r"[ \t]+"," ",body)
                      records.append({"id":uid,"from":header("From"),"to":header("To"),"subject":header("Subject"),"date":header("Date"),"auto":header("Auto-Submitted"),"listid":header("List-Id"),"unsubscribe":bool(header("List-Unsubscribe")),"spam":header("X-Spam-Status"),"body":body[:14000]})
                  except (SystemExit,Exception) as ex:
                      errors+=1
                      records.append({"id":uid,"unreadable":True,"error":type(ex).__name__})
                  count+=1
                  if count%25==0: print("READ_PROGRESS="+str(count),flush=True)
          blob=gzip.compress(json.dumps(records,ensure_ascii=False).encode())
          key=os.urandom(32)
          nonce=os.urandom(12)
          encrypted=AESGCM(key).encrypt(nonce,blob,None)
          wrapped=pub.encrypt(key,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          payload={k:base64.b64encode(v).decode() for k,v in {"key":wrapped,"nonce":nonce,"ciphertext":encrypted}.items()}
          print("ENCRYPTED_REVIEW="+json.dumps(payload,separators=(",",":")))
          print("REVIEW_COUNT="+str(count))
          print("READ_ERRORS="+str(errors))
          
