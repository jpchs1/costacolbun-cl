name: Configure Clasesdeski spam filter
on:
  push:
    branches: [ops/clasesdeski-mail-audit-20261103]
    paths: [.github/workflows/clasesdeski-mail-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - name: Apply authorized mailbox-only spam filter
        env:
          CPANEL_URL: ${{ secrets.CPANEL_URL }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
        shell: python
        run: |
          import base64
          import http.cookiejar
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import uuid
          
          required = ("CPANEL_URL", "CPANEL_USERNAME", "CPANEL_PASSWORD")
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit("Faltan secretos: " + ", ".join(missing))
          origin = os.environ["CPANEL_URL"].strip().rstrip("/")
          parsed = urllib.parse.urlsplit(origin)
          if parsed.scheme != "https" or parsed.username or parsed.password or parsed.path or parsed.query or parsed.fragment:
              raise SystemExit("CPANEL_URL debe ser una URL HTTPS del servidor, sin ruta.")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          client = urllib.request.build_opener(NoRedirect(), urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          session_token = ''
          credentials = os.environ["CPANEL_USERNAME"] + ":" + os.environ["CPANEL_PASSWORD"]
          authorization = "Basic " + base64.b64encode(credentials.encode()).decode()
          
          def api(module, function, params=None, body=None, content_type=None):
              global session_token
              url = origin + session_token + "/execute/" + module + "/" + function
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              headers = {"Authorization": authorization, "Accept": "application/json"}
              if content_type:
                  headers["Content-Type"] = content_type
              request = urllib.request.Request(url, data=body, headers=headers)
              try:
                  with client.open(request, timeout=90) as response:
                      result = json.loads(response.read().decode('utf-8', errors='replace'))
              except urllib.error.HTTPError as error:
                  if error.code == 401 and not session_token:
                      print("La autenticacion HTTP directa fue rechazada. Comprobando inicio de sesion de cPanel.")
                      payload = urllib.parse.urlencode({"user": os.environ["CPANEL_USERNAME"], "pass": os.environ["CPANEL_PASSWORD"], "goto_uri": "/"}).encode()
                      login_request = urllib.request.Request(origin + "/login/?login_only=1", data=payload, headers={"Content-Type": "application/x-www-form-urlencoded", "Accept": "application/json"})
                      try:
                          with client.open(login_request, timeout=60) as login_response:
                              login = json.load(login_response)
                      except urllib.error.HTTPError as login_error:
                          raw = login_error.read().decode("utf-8", errors="replace").lower()
                          if "two" in raw and "factor" in raw:
                              reason = "El servidor solicita segundo factor."
                          elif "brute" in raw or "cphulk" in raw or "blocked" in raw:
                              reason = "El servidor indica bloqueo de acceso."
                          else:
                              reason = "El inicio de sesion de cPanel tambien fue rechazado (HTTP " + str(login_error.code) + ")."
                          raise SystemExit(reason) from None
                      except (OSError, ValueError):
                          raise SystemExit("No se pudo completar el inicio de sesion de cPanel.") from None
                      token = login.get("security_token", "")
                      if login.get("status") != 1 or not re.fullmatch(r"/cpsess[0-9]+", token):
                          reason = "cPanel no concedio una sesion."
                          if login.get("tfa_required") or login.get("two_factor_authentication_required"):
                              reason = "cPanel solicita segundo factor."
                          raise SystemExit(reason)
                      session_token = token
                      print("Inicio de sesion de cPanel confirmado.")
                      return api(module, function, params, body, content_type)
                  raise SystemExit("cPanel devolvio HTTP " + str(error.code) + " en " + module + "/" + function) from None
              except (OSError, ValueError) as exc:
                  print("API_RESPONSE_ERROR_TYPE=" + type(exc).__name__)
                  raise SystemExit("No se pudo conectar o interpretar la respuesta de cPanel en " + module + "/" + function) from None
              if result.get("status") != 1:
                  # Avoid printing server responses that may include sensitive request details.
                  raise SystemExit("cPanel rechazo " + module + "/" + function + ". No se publicaron los siguientes archivos.")
              return result.get("data")
          
          
          
          target="info@clasesdeski.cl"
          name="Clasesdeski Spam score 5"
          accounts=api("Email","list_pops",{"regex":"^info@clasesdeski[.]cl$"})
          if not isinstance(accounts,list) or not any(a.get("email")==target for a in accounts):
              raise SystemExit("Target mailbox not confirmed")
          root="/home/"+os.environ["CPANEL_USERNAME"]+"/mail/clasesdeski.cl/info"
          destination=root+"/.spam"
          # Check the existing Spam Maildir before installing any filter.
          for sub in ("cur","new","tmp"):
              api("Fileman","list_files",{"dir":destination+"/"+sub,"include_mime":0})
          existing=api("Email","list_filters",{"account":target}) or []
          if any(isinstance(f,dict) and (f.get("filtername")==name or f.get("name")==name) for f in existing):
              raise SystemExit("A filter with the same name already exists; left unchanged.")
          params={"account":target,"filtername":name,"part1":"$h_x-Spam-Bar:","match1":"contains","val1":"+++++","action1":"save","dest1":destination}
          api("Email","store_filter",params)
          # Read back the filter and validate the saved rule and destination.
          saved=api("Email","get_filter",{"account":target,"filtername":name})
          serialized=json.dumps(saved,sort_keys=True)
          rules=saved.get("rules",[]) if isinstance(saved,dict) else []
          actions=saved.get("actions",[]) if isinstance(saved,dict) else []
          verified=(len(rules)==1 and len(actions)==1
                    and rules[0].get("part")=="$h_x-Spam-Bar:"
                    and rules[0].get("match")=="contains"
                    and rules[0].get("val")=="+++++"
                    and actions[0].get("action")=="save"
                    and actions[0].get("dest") in (destination,"/.spam"))
          if not verified:
              api("Email","delete_filter",{"account":target,"filtername":name})
              raise SystemExit("Verification failed; newly created filter removed.")
          print("FILTER_CREATED_AND_VERIFIED")
          print("ACCOUNT=info@clasesdeski.cl")
          print("THRESHOLD=5")
          print("ACTION=SAVE_TO_EXISTING_SPAM_FOLDER")
          print("AUTOMATIC_DELETION=UNCHANGED")
          print("EXISTING_MESSAGES=UNCHANGED")
          print("OTHER_MAILBOXES=UNCHANGED")
          
