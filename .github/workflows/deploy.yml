name: Publicar Costa Colbun

on:
  push:
    branches: [main-branch]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: costa-colbun-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main-branch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://www.costacolbun.cl/
    steps:
      - name: Descargar version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validar JavaScript
        run: node --check js/main.js

      - name: Publicar mediante API de cPanel
        env:
          CPANEL_URL: ${{ secrets.CPANEL_URL }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
          DEPLOY_SHA: ${{ github.sha }}
        shell: python
        run: |
          import base64
          import http.cookiejar
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import uuid

          required = ("CPANEL_URL", "CPANEL_USERNAME", "CPANEL_PASSWORD")
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit("Faltan secretos: " + ", ".join(missing))
          origin = os.environ["CPANEL_URL"].strip().rstrip("/")
          parsed = urllib.parse.urlsplit(origin)
          if parsed.scheme != "https" or parsed.username or parsed.password or parsed.path or parsed.query or parsed.fragment:
              raise SystemExit("CPANEL_URL debe ser una URL HTTPS del servidor, sin ruta.")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          client = urllib.request.build_opener(NoRedirect(), urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          session_token = ''
          credentials = os.environ["CPANEL_USERNAME"] + ":" + os.environ["CPANEL_PASSWORD"]
          authorization = "Basic " + base64.b64encode(credentials.encode()).decode()

          def api(module, function, params=None, body=None, content_type=None):
              global session_token
              url = origin + session_token + "/execute/" + module + "/" + function
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              headers = {"Authorization": authorization, "Accept": "application/json"}
              if content_type:
                  headers["Content-Type"] = content_type
              request = urllib.request.Request(url, data=body, headers=headers)
              try:
                  with client.open(request, timeout=90) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 401 and not session_token:
                      print("La autenticacion HTTP directa fue rechazada. Comprobando inicio de sesion de cPanel.")
                      payload = urllib.parse.urlencode({"user": os.environ["CPANEL_USERNAME"], "pass": os.environ["CPANEL_PASSWORD"], "goto_uri": "/"}).encode()
                      login_request = urllib.request.Request(origin + "/login/?login_only=1", data=payload, headers={"Content-Type": "application/x-www-form-urlencoded", "Accept": "application/json"})
                      try:
                          with client.open(login_request, timeout=60) as login_response:
                              login = json.load(login_response)
                      except urllib.error.HTTPError as login_error:
                          raw = login_error.read().decode("utf-8", errors="replace").lower()
                          if "two" in raw and "factor" in raw:
                              reason = "El servidor solicita segundo factor."
                          elif "brute" in raw or "cphulk" in raw or "blocked" in raw:
                              reason = "El servidor indica bloqueo de acceso."
                          else:
                              reason = "El inicio de sesion de cPanel tambien fue rechazado (HTTP " + str(login_error.code) + ")."
                          raise SystemExit(reason) from None
                      except (OSError, ValueError):
                          raise SystemExit("No se pudo completar el inicio de sesion de cPanel.") from None
                      token = login.get("security_token", "")
                      if login.get("status") != 1 or not re.fullmatch(r"/cpsess[0-9]+", token):
                          reason = "cPanel no concedio una sesion."
                          if login.get("tfa_required") or login.get("two_factor_authentication_required"):
                              reason = "cPanel solicita segundo factor."
                          raise SystemExit(reason)
                      session_token = token
                      print("Inicio de sesion de cPanel confirmado.")
                      return api(module, function, params, body, content_type)
                  raise SystemExit("cPanel devolvio HTTP " + str(error.code) + " en " + module + "/" + function) from None
              except (OSError, ValueError):
                  raise SystemExit("No se pudo conectar o interpretar la respuesta de cPanel en " + module + "/" + function) from None
              if result.get("status") != 1:
                  # Avoid printing server responses that may include sensitive request details.
                  raise SystemExit("cPanel rechazo " + module + "/" + function + ". No se publicaron los siguientes archivos.")
              return result.get("data")

          data = api("DomainInfo", "single_domain_data", {"domain": "costacolbun.cl"})
          def roots(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      if key == "documentroot" and isinstance(item, str):
                          yield item
                      else:
                          yield from roots(item)
              elif isinstance(value, list):
                  for item in value:
                      yield from roots(item)
          matches = set(roots(data))
          if len(matches) != 1:
              raise SystemExit("No se pudo identificar una carpeta unica para costacolbun.cl.")
          document_root = matches.pop()
          path = PurePosixPath(document_root)
          if not path.is_absolute() or ".." in path.parts or len(path.parts) < 4:
              raise SystemExit("La carpeta del dominio no es valida para publicar.")
          print("Dominio confirmado: costacolbun.cl")
          print("Carpeta confirmada por cPanel: " + document_root)

          root = Path.cwd()
          files = [root / ".htaccess"]
          for folder in ("css", "js", "img", "blog"):
              files.extend(sorted((root / folder).rglob("*")))
          files = [p for p in files if p.is_file()]
          files.append(root / "index.html")
          if any(p.is_symlink() for p in files):
              raise SystemExit("No se publican enlaces simbolicos.")
          sha = os.environ["DEPLOY_SHA"]
          published = {}
          for source in files:
              relative = source.relative_to(root).as_posix()
              content = source.read_bytes()
              if relative == "index.html":
                  text = content.decode("utf-8")
                  text = re.sub(r'(css/style\.css|js/main\.js)(?:\?[^"]*)?', lambda m: m[1] + "?v=" + sha, text)
                  content = text.encode("utf-8")
              boundary = "cpanel" + uuid.uuid4().hex
              fields = {"dir": str(path / PurePosixPath(relative).parent), "overwrite": "1"}
              parts = []
              for name, value in fields.items():
                  parts.append(("--" + boundary + '\r\nContent-Disposition: form-data; name="' + name + '"\r\n\r\n' + value + "\r\n").encode())
              parts.append(("--" + boundary + '\r\nContent-Disposition: form-data; name="file-1"; filename="' + source.name + '"\r\nContent-Type: application/octet-stream\r\n\r\n').encode())
              parts.extend([content, ("\r\n--" + boundary + "--\r\n").encode()])
              api("Fileman", "upload_files", body=b"".join(parts), content_type="multipart/form-data; boundary=" + boundary)
              if relative in ("index.html", "css/style.css", "js/main.js"):
                  published[relative] = hashlib.sha256(content).hexdigest()
              print("Publicado: " + relative)

          # Verify public HTML and critical assets without sending cPanel credentials.
          for attempt in range(12):
              verified = True
              for relative, expected in published.items():
                  public_path = "" if relative == "index.html" else relative
                  url = "https://www.costacolbun.cl/" + public_path + "?v=" + sha
                  try:
                      request = urllib.request.Request(url, headers={"Cache-Control": "no-cache", "User-Agent": "CostaColbun-Deploy"})
                      with urllib.request.urlopen(request, timeout=30) as response:
                          actual = hashlib.sha256(response.read()).hexdigest()
                      if actual != expected:
                          verified = False
                  except OSError:
                      verified = False
              if verified:
                  print("Produccion verificada: portada, CSS y JavaScript.")
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                      summary.write("Publicado y verificado: https://www.costacolbun.cl/\n")
                  break
              if attempt < 11:
                  time.sleep(10)
          else:
              raise SystemExit("Archivos enviados, pero la version publica aun no coincide.")
