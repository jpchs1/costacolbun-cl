name: Publicar Costa Colbun

on:
  push:
    branches: [main-branch]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: costa-colbun-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main-branch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://www.costacolbun.cl/
    steps:
      - name: Descargar version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validar JavaScript
        run: node --check js/main.js

      - name: Publicar por FTPS y verificar produccion
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          DEPLOY_SHA: ${{ github.sha }}
        shell: python
        run: |
          import ftplib
          import hashlib
          import os
          from pathlib import Path, PurePosixPath
          import ssl
          import time
          import urllib.request

          required = ("FTP_SERVER", "FTP_USERNAME", "FTP_PASSWORD", "FTP_SERVER_DIR")
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit("Faltan secretos de GitHub Actions: " + ", ".join(missing))

          remote = os.environ["FTP_SERVER_DIR"]
          if any(c in remote for c in ("\r", "\n")) or ".." in PurePosixPath(remote).parts:
              raise SystemExit("FTP_SERVER_DIR no es una ruta valida.")

          root = Path.cwd()
          files = []
          for folder in ("css", "js", "img", "blog"):
              files.extend(p for p in (root / folder).rglob("*") if p.is_file())
          files.extend([root / ".htaccess", root / "index.html"])
          if any(p.is_symlink() for p in files):
              raise SystemExit("No se publican enlaces simbolicos.")
          if not all(p.is_file() for p in files):
              raise SystemExit("Faltan archivos del sitio.")
          # index.html is uploaded last. Existing server files (including Tour 360) are preserved.
          files.sort(key=lambda p: (p.name == "index.html", p.as_posix()))
          expected = hashlib.sha256((root / "index.html").read_bytes()).hexdigest()

          with ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=60) as ftp:
              ftp.connect(os.environ["FTP_SERVER"], 21)
              ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
              ftp.prot_p()
              # The configured document root must already exist.
              ftp.cwd(remote)
              base = ftp.pwd()
              for path in files:
                  relative = path.relative_to(root)
                  ftp.cwd(base)
                  for part in relative.parts[:-1]:
                      try:
                          ftp.cwd(part)
                      except ftplib.error_perm:
                          ftp.mkd(part)
                          ftp.cwd(part)
                  with path.open("rb") as source:
                      ftp.storbinary("STOR " + relative.name, source)
                  print("Publicado: " + relative.as_posix())

          url = "https://www.costacolbun.cl/?deploy=" + os.environ["DEPLOY_SHA"]
          for attempt in range(12):
              try:
                  request = urllib.request.Request(url, headers={"Cache-Control": "no-cache", "User-Agent": "CostaColbun-Deploy"})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      actual = hashlib.sha256(response.read()).hexdigest()
                  if actual == expected:
                      print("Produccion verificada: https://www.costacolbun.cl/")
                      summary = os.environ.get("GITHUB_STEP_SUMMARY")
                      if summary:
                          with open(summary, "a", encoding="utf-8") as output:
                              output.write("Publicado y verificado en https://www.costacolbun.cl/\n")
                      break
              except (OSError, urllib.error.URLError):
                  pass
              if attempt < 11:
                  time.sleep(10)
          else:
              raise SystemExit("Archivos enviados, pero no se pudo verificar la nueva portada en produccion.")
