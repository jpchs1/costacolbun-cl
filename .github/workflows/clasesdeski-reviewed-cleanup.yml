          wanted={uid:"spam" for uid in decisions["spam"]}
          wanted.update({uid:"archive" for uid in decisions["archive"]})
          def api2(function,params):
              params={"cpanel_jsonapi_user":os.environ["CPANEL_USERNAME"],"cpanel_jsonapi_apiversion":"2","cpanel_jsonapi_module":"Fileman","cpanel_jsonapi_func":function,**params}
              req=urllib.request.Request(origin+session_token+"/json-api/cpanel?"+urllib.parse.urlencode(params),headers={"Authorization":authorization,"Accept":"application/json"})
              with client.open(req,timeout=90) as response: result=json.load(response).get("cpanelresult",{})
              if result.get("event",{}).get("result")!=1: raise SystemExit("Folder operation failed")
              return result
          folders=names(root)
          archive_name=next((x for x in (".Archive",".Archives",".Archivo",".Archivados") if x in folders),".Archive")
          if archive_name not in folders:
              api2("mkdir",{"path":root,"name":archive_name,"permissions":"0700"})
          for child in ("new","cur","tmp"):
              if child not in names(root+"/"+archive_name):
                  api2("mkdir",{"path":root+"/"+archive_name,"name":child,"permissions":"0700"})
          destroot={"spam":root+"/.spam","archive":root+"/"+archive_name}
          for dst in destroot.values():
              for sub in ("new","cur"): names(dst+"/"+sub)
          def download(folder,name):
              url=origin+session_token+"/download?file="+urllib.parse.quote(folder+"/"+name,safe="")
              req=urllib.request.Request(url,headers={"Authorization":authorization})
              with client.open(req,timeout=90) as response:
                  raw=response.read(30000000)
              if len(raw)>=30000000: raise SystemExit("Unexpected message size")
              return raw
          found=set()
          stats={"spam_moved":0,"archived":0,"collisions":0,"changed_or_missing":0}
          for sub in ("new","cur"):
              folder=root+"/"+sub
              entries=names(folder)
              cache={kind:names(dst+"/"+sub) for kind,dst in destroot.items()}
              for name,entry in entries.items():
                  if "/" in name or name.startswith(".") or entry.get("type")=="dir": continue
                  uid=hashlib.sha256((sub+"/"+name).encode()).hexdigest()
                  if uid not in wanted: continue
                  kind=wanted[uid]
                  found.add(uid)
                  dest=destroot[kind]+"/"+sub
                  if name in cache[kind]:
                      stats["collisions"]+=1
                      continue
                  raw=download(folder,name)
                  move(folder+"/"+name,dest)
                  copied=download(dest,name)
                  if hashlib.sha256(raw).digest()!=hashlib.sha256(copied).digest():
                      raise SystemExit("Message preservation verification failed; stop")
                  stats["spam_moved" if kind=="spam" else "archived"]+=1
                  cache[kind][name]=entry
                  print("VERIFIED_MOVES="+str(stats["spam_moved"]+stats["archived"]),flush=True)
          stats["changed_or_missing"]=len(set(wanted)-found)
          remaining=0
          still_targeted=0
          for sub in ("new","cur"):
              for name,entry in names(root+"/"+sub).items():
                  if "/" in name or name.startswith(".") or entry.get("type")=="dir": continue
                  remaining+=1
                  still_targeted+=int(hashlib.sha256((sub+"/"+name).encode()).hexdigest() in wanted)
          stats["remaining_inbox"]=remaining
          stats["targeted_still_in_inbox"]=still_targeted
          print("MANUAL_CLEANUP_RESULT="+json.dumps(stats,sort_keys=True))
          if still_targeted or stats["collisions"] or stats["changed_or_missing"]:
